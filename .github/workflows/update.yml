name: Update flake

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake update
      - run: nix flake check
      - uses: peter-evans/create-pull-request@v7
        with:
          add-paths: flake.lock
          commit-message: "update flake inputs"
          title: "Update flake inputs"
          branch: flake-update
          delete-branch: true
          body: "Automated nix flake update. The check step is the same nix flake check used by the Check workflow."
